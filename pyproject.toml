[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cc2go"
version = "0.7.3"
description = "Claude Code to OpenCode Go adapter — route Anthropic format to OpenAI models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["claude-code", "opencode", "llm-proxy", "ai-adapter", "anthropic", "openai"]
authors = [
    {name = "lzg14"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/lzg14/cc2go"
Source = "https://github.com/lzg14/cc2go"
BugTracker = "https://github.com/lzg14/cc2go/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project.scripts]
cc2go = "router:main"

[tool.ruff]
line-length = 120
target-version = "py39"
