name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Lint
      run: |
        pip install ruff
        ruff check src/

    - name: Run tests
      run: |
        python -m unittest discover -s src -p "*_test.py" -v

  build:
    needs: lint-and-test
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt pyinstaller

    - name: Build release
      run: python build_release.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: cc2go-release
        path: cc2go-*-windows.zip

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: cc2go-release
        path: artifact

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifact/*.zip
        draft: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
